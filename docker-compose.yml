name: tourism-platform

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "14927"
      ENABLE_DEMO_PAYMENT: "false"
      TRUST_PROXY: "0"
    ports:
      - "14927:14927"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:14927/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "14928:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend-admin:
    build:
      context: ./frontend-manh-admin
    restart: unless-stopped
    ports:
      - "14929:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  backend_uploads:
